<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>DiT k12 int4 b128</title>
<style>body{background:#14130f;color:#ecebe6;font:13px/1.6 ui-monospace,Menlo,monospace;padding:20px}#t td{padding:2px 16px 2px 0}.ok{color:#7fd18a}.bad{color:#e57b6b}.dim{color:#9c9a92}#log{white-space:pre-wrap;color:#9c9a92}</style>
</head>
<body>
<table id="t"></table><div id="log"></div>
<script type="module">
import { parseNPY } from '../../site/src/npy.js';

// The b128 graph is the open question: ORT-web's CPU kernel takes block sizes
// 16..256, the WebGPU kernel has no visible check, and the op doc still says
// "only 32". This page answers it twice - does WebGPU build the session, and
// does its arithmetic match the wasm EP on the same weights.
//
// The wasm reference run is opt-in (?ref=1): on CPU this graph is minutes per
// step, which looks exactly like a dead page. Timing alone tells the b128
// story - a CPU fallback would not finish a step in seconds.
const Q = new URLSearchParams(location.search);
const REF = Q.get('ref') === '1';
const ORT_BASE = Q.get('ort') || 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/';
const ort = await import(ORT_BASE + 'ort.webgpu.min.mjs');
ort.env.wasm.wasmPaths = ORT_BASE;
try { ort.env.webgpu.powerPreference = 'high-performance'; } catch {}

const BASE = Q.get('base') || '../../w/';
const GRAPH = Q.get('graph') || 'dit.k12.int4.mha.onnx';
const rows = [], $t = document.getElementById('t'), $l = document.getElementById('log');
const row = (k, v, cls = '') => {
  rows.push([k, v]); window.__rows = rows;
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${k}</td><td class="${cls}">${v}</td>`;
  $t.appendChild(tr);
};
const log = (s) => { $l.textContent += s + '\n'; };
const npy = async (f) => parseNPY(await (await fetch(BASE + f)).arrayBuffer());
function stat(a, b) {
  let d = 0, x = 0, y = 0, e = 0;
  for (let i = 0; i < a.length; i++) {
    d += a[i] * b[i]; x += a[i] * a[i]; y += b[i] * b[i];
    const t = a[i] - b[i]; e += t * t;
  }
  return { cos: d / Math.sqrt(x * y), rel: Math.sqrt(e) / Math.sqrt(y) };
}
const finite = (a) => { for (let i = 0; i < a.length; i++) if (!Number.isFinite(a[i])) return false; return true; };

async function main() {
  const adapter = await navigator.gpu?.requestAdapter({ powerPreference: 'high-performance' });
  row('adapter', adapter ? [(adapter.info?.vendor || ''), (adapter.info?.architecture || '')].join(' ') : 'none', 'dim');
  const bytes = new Uint8Array(await (await fetch(BASE + GRAPH)).arrayBuffer());
  row('graph', `${GRAPH} · ${(bytes.length / 1e6).toFixed(1)} MB`, 'dim');

  const t0 = performance.now();
  const gpu = await ort.InferenceSession.create(bytes, {
    executionProviders: ['webgpu'], graphOptimizationLevel: 'all',
  });
  row('webgpu session', `${(performance.now() - t0).toFixed(0)} ms · in ${gpu.inputNames.join(',')}`, 'ok');

  const t1 = performance.now();
  let cpu = null;
  if (REF) {
    cpu = await ort.InferenceSession.create(bytes, {
      executionProviders: ['wasm'], graphOptimizationLevel: 'all',
    });
    row('wasm session', `${(performance.now() - t1).toFixed(0)} ms`, 'dim');
  }

  const [f1n, f2n, n0, n1] = await Promise.all(
    ['cond_feature1.npy', 'cond_feature2.npy', 'noise_0.npy', 'noise_1.npy'].map(npy));
  const f1 = new Float32Array(f1n.data);
  const f2 = new Float32Array(4096 * 128);
  f2.set(f2n.data.subarray(5 * 128, 5 * 128 + 4096 * 128));
  row('fixtures', `f1 ${f1n.shape} · f2 ${f2n.shape} -> ${4096 * 128}`, 'dim');

  let lat = new Float32Array(n0.data);
  let cam = new Float32Array(n1.data).slice(0, 5);
  const feeds = (l, c, t) => ({
    latent: new ort.Tensor('float32', l, [1, 8192, 16]),
    camera: new ort.Tensor('float32', c, [1, 1, 5]),
    feature1: new ort.Tensor('float32', f1, [1, 4101, 1280]),
    feature2: new ort.Tensor('float32', f2, [1, 4096, 128]),
    t: new ort.Tensor('float32', new Float32Array([1000 * t]), [1]),
  });

  // Native k12 grid: t 1 -> .9 -> .75 -> .5 -> 0, dt .1/.15/.25/.5.
  const grid = [[1, 0.9], [0.9, 0.75], [0.75, 0.5], [0.5, 0]];
  for (let s = 0; s < grid.length; s++) {
    const [t, tp] = grid[s], dt = t - tp;
    const st = performance.now();
    const out = await gpu.run(feeds(lat, cam, t));
    const ms = performance.now() - st;
    if (s === 0 && ms > 90_000) {
      row('aborted', `step 1 took ${(ms / 1000).toFixed(0)} s — suspect a CPU fallback`, 'bad');
      break;
    }
    const vl = out.out_latent.data, vc = out.out_camera.data;
    if (s === 0 && cpu) {
      const ref = await cpu.run(feeds(lat, cam, t));
      const sl = stat(vl, ref.out_latent.data), sc = stat(vc, ref.out_camera.data);
      row('  webgpu vs wasm, latent v', `cos ${sl.cos.toFixed(6)} · rel_l2 ${sl.rel.toFixed(5)}`, sl.cos > 0.999 ? 'ok' : 'bad');
      row('  webgpu vs wasm, camera v', `cos ${sc.cos.toFixed(6)} · rel_l2 ${sc.rel.toFixed(5)}`, sc.cos > 0.999 ? 'ok' : 'bad');
    }
    for (let i = 0; i < lat.length; i++) lat[i] -= vl[i] * dt;
    for (let i = 0; i < cam.length; i++) cam[i] -= vc[i] * dt;
    const ok = finite(lat);
    row(`step ${s + 1} (t=${t})`, `${ms.toFixed(0)} ms · finite ${ok}`, ok ? 'ok' : 'bad');
    log(`  step ${s + 1}: latent std ${Math.sqrt(lat.reduce((a, x) => a + x * x, 0) / lat.length).toFixed(4)} · camera ${[...cam].map((v) => v.toFixed(4)).join(' ')}`);
  }
}

main().then(() => { window.__done = true; document.title = 'READY'; })
  .catch((e) => { row('error', String(e.message).slice(0, 300), 'bad'); log(String(e.stack || e)); window.__done = true; document.title = 'READY'; });
</script>
</body></html>
