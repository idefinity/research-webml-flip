<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>int4 GEMM · WebGPU</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 28px 32px; background: #14130f; color: #ecebe6;
         font: 14px/1.65 ui-sans-serif, -apple-system, "PingFang SC", sans-serif; }
  h1 { font-size: 17px; font-weight: 500; margin: 0 0 4px; }
  p.sub { color: #9c9a92; margin: 0 0 20px; font-size: 13px; }
  table { border-collapse: collapse; margin: 8px 0 18px; font-variant-numeric: tabular-nums; }
  td, th { padding: 5px 14px 5px 0; text-align: left; font-weight: 400; font-size: 13px; }
  th { color: #9c9a92; }
  .ok { color: #7fd18a; } .bad { color: #e57b6b; }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  pre { background: #1c1b16; padding: 12px 14px; border-radius: 8px; overflow-x: auto;
        border: 1px solid #2b2a24; }
  #log { color: #9c9a92; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>int4 GEMM · WebGPU</h1>
<p class="sub">C[M,N] = A[M,K] · W[N,K]ᵀ，W 为 4 bit、每 32 个权重一个 scale、zero point 8。格式与 k2m 打包出的 int4.bin 逐字节一致。</p>
<table id="t"><tr><th>stage</th><th>result</th></tr></table>
<div id="log"></div>

<script type="module">
const wgsl = /* wgsl */`
// 128x64 tile, 256 threads, 8x4 outputs per thread. The first version was
// 64x64 / 4x4 and ran at 408 GFLOP/s, which would put one 2-step forward at
// ~20 s: the block is 26 transformer blocks deep and each has four GEMMs, so
// the kernel has to be within ~3x of the GPU's fp32 peak to be worth having.
// Register blocking is the cheap lever: 4x4 re-reads 8 shared values for every
// 16 FMAs, 8x4 re-reads 12 for 32.
struct Dims { m: u32, n: u32, k: u32, pad: u32 };
@group(0) @binding(0) var<storage, read> A: array<f32>;
@group(0) @binding(1) var<storage, read> Wq: array<u32>;
@group(0) @binding(2) var<storage, read> Ws: array<f32>;
@group(0) @binding(3) var<storage, read_write> C: array<f32>;
@group(0) @binding(4) var<uniform> d: Dims;

const TM = 128u;
const TN = 64u;
const BK = 32u;

var<workgroup> As: array<f32, 128 * 32>;
var<workgroup> Bs: array<f32, 32 * 64>;   // [k][n]: a row-major B makes 16 threads hit one bank

@compute @workgroup_size(16, 16, 1)
fn main(@builtin(workgroup_id) wid: vec3<u32>,
        @builtin(local_invocation_index) lid: u32) {
  let bm = wid.x * TM;
  let bn = wid.y * TN;
  let row0 = (lid / 16u) * 8u;     // this thread's first m
  let col0 = (lid % 16u) * 4u;     // this thread's first n
  let kbytes = d.k / 2u;
  let kblocks = d.k / 32u;

  var acc: array<f32, 32>;
  for (var i = 0u; i < 32u; i = i + 1u) { acc[i] = 0.0; }

  for (var kb = 0u; kb < kblocks; kb = kb + 1u) {
    let k0 = kb * BK;

    // A tile, vectorised: 128*32 floats is 1024 vec4, 4 per thread
    for (var f = 0u; f < 4u; f = f + 1u) {
      let vi = lid * 4u + f;                 // vec4 index
      let r = vi / 8u;                       // 32 floats = 8 vec4 per row
      let c4 = (vi % 8u) * 4u;
      let gm = bm + r;
      var v = vec4<f32>(0.0, 0.0, 0.0, 0.0);
      if (gm < d.m) { v = vec4<f32>(A[gm * d.k + k0 + c4], A[gm * d.k + k0 + c4 + 1u],
                                    A[gm * d.k + k0 + c4 + 2u], A[gm * d.k + k0 + c4 + 3u]); }
      As[r * 32u + c4] = v.x;
      As[r * 32u + c4 + 1u] = v.y;
      As[r * 32u + c4 + 2u] = v.z;
      As[r * 32u + c4 + 3u] = v.w;
    }

    // W tile: 64 rows x 16 bytes = 1024 bytes, one u32 each
    {
      let byte_i = lid * 4u;
      let r = byte_i / 16u;
      let j = (byte_i % 16u) / 4u;           // which u32 inside the row's 32-byte block
      let row = bn + r;
      var packed = 0u;
      var scale = 0.0;
      if (row < d.n) {
        packed = Wq[(row * kbytes + kb * 16u) / 4u + j];
        scale = Ws[row * kblocks + kb];
      }
      for (var b = 0u; b < 4u; b = b + 1u) {
        let byte = (packed >> (b * 8u)) & 0xffu;
        let jj = j * 4u + b;
        Bs[(jj * 2u) * 64u + r] = f32(i32(byte & 0x0fu) - 8) * scale;
        Bs[(jj * 2u + 1u) * 64u + r] = f32(i32((byte >> 4u) & 0x0fu) - 8) * scale;
      }
    }

    workgroupBarrier();

    for (var kk = 0u; kk < BK; kk = kk + 1u) {
      var av: array<f32, 8>;
      var bv: array<f32, 4>;
      for (var i = 0u; i < 8u; i = i + 1u) { av[i] = As[(row0 + i) * 32u + kk]; }
      for (var j = 0u; j < 4u; j = j + 1u) { bv[j] = Bs[kk * 64u + col0 + j]; }
      for (var i = 0u; i < 8u; i = i + 1u) {
        for (var j = 0u; j < 4u; j = j + 1u) {
          acc[i * 4u + j] = acc[i * 4u + j] + av[i] * bv[j];
        }
      }
    }
    workgroupBarrier();
  }

  if (d.pad == 1u && wid.x == 0u && wid.y == 0u) {
    if (lid < 32u) { C[lid] = As[lid]; C[32u + lid] = Bs[lid]; }
    return;
  }

  for (var i = 0u; i < 8u; i = i + 1u) {
    let gm = bm + row0 + i;
    if (gm >= d.m) { continue; }
    for (var j = 0u; j < 4u; j = j + 1u) {
      let gn = bn + col0 + j;
      if (gn >= d.n) { continue; }
      C[gm * d.n + gn] = acc[i * 4u + j];
    }
  }
}
`;

const $t = document.getElementById('t');
const logEl = document.getElementById('log');
function row(k, v, cls) {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${k}</td><td class="${cls || ''}">${v}</td>`;
  $t.appendChild(tr);
}
function log(s) { logEl.textContent += s + '\n'; console.log(s); }

// ---- 打包：与 scripts/k2m_int4_pack.py 的 quantize() 同一套算法 ----------
function pack(w, n, k, block = 32) {
  const q = new Uint8Array(n * k / 2);
  const s = new Float32Array(n * k / block);
  for (let r = 0; r < n; r++) {
    for (let b = 0; b < k / block; b++) {
      let mx = 1e-12;
      for (let i = 0; i < block; i++) mx = Math.max(mx, Math.abs(w[r * k + b * block + i]));
      const scale = Math.max(mx / 7, 1e-8);
      s[r * (k / block) + b] = scale;
      for (let i = 0; i < block; i += 2) {
        const a = Math.max(-8, Math.min(7, Math.round(w[r * k + b * block + i] / scale))) + 8;
        const c = Math.max(-8, Math.min(7, Math.round(w[r * k + b * block + i + 1] / scale))) + 8;
        q[r * (k / 2) + b * 16 + i / 2] = a | (c << 4);
      }
    }
  }
  return { q, s };
}
function unpack(q, s, n, k, block = 32) {
  const out = new Float32Array(n * k);
  for (let r = 0; r < n; r++)
    for (let b = 0; b < k / block; b++) {
      const scale = s[r * (k / block) + b];
      for (let i = 0; i < block; i++) {
        const byte = q[r * (k / 2) + b * 16 + (i >> 1)];
        const nib = (i & 1) ? (byte >> 4) & 15 : byte & 15;
        out[r * k + b * block + i] = (nib - 8) * scale;
      }
    }
  return out;
}

function cpuRef(A, W, M, N, K) {
  const C = new Float32Array(M * N);
  for (let m = 0; m < M; m++)
    for (let n = 0; n < N; n++) {
      let acc = 0;
      for (let k = 0; k < K; k++) acc += A[m * K + k] * W[n * K + k];
      C[m * N + n] = acc;
    }
  return C;
}

const gpu = (() => {
  let seed = 12345;
  return () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff - 0.5;
})();

async function main() {
  if (!navigator.gpu) { row('WebGPU', '不可用（这个浏览器/构建没开）', 'bad'); return; }
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) { row('adapter', 'none', 'bad'); return; }
  const info = adapter.info || {};
  row('adapter', [info.vendor, info.architecture, info.description].filter(Boolean).join(' ') || 'unknown');
  // 128x64 tiles need 24 KB of workgroup storage; the default limit is 16 KB
  // and an over-limit pipeline is created *invalid* rather than throwing, so
  // every dispatch silently does nothing and the timing gets faster. That is
  // how this page first reported a 6x speedup with an all-zero output.
  const dev = await adapter.requestDevice({
    requiredLimits: {
      maxComputeWorkgroupStorageSize: adapter.limits.maxComputeWorkgroupStorageSize,
      maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize,
      maxBufferSize: adapter.limits.maxBufferSize,
    },
  });
  row('limits', `workgroup storage ${adapter.limits.maxComputeWorkgroupStorageSize} B · max buffer ${(adapter.limits.maxBufferSize / 2 ** 30).toFixed(1)} GiB`);
  dev.addEventListener('uncapturederror', e => log('GPU error: ' + e.error.message));
  const module = dev.createShaderModule({ code: wgsl });
  const infoLog = await module.getCompilationInfo();
  const errs = infoLog.messages.filter(m => m.type === 'error');
  if (errs.length) {
    row('shader', `${errs.length} 个编译错误`, 'bad');
    log(errs.map(e => `${e.lineNum}:${e.linePos} ${e.message}`).join('\n'));
    return;
  }
  row('shader', 'compiled', 'ok');

  async function run(M, N, K, check, pad = 0) {
    const A = new Float32Array(M * K);
    const W = new Float32Array(N * K);
    for (let i = 0; i < A.length; i++) A[i] = gpu();
    for (let i = 0; i < W.length; i++) W[i] = gpu() * 0.1;
    const { q, s } = pack(W, N, K);

    const buf = (data, usage) => {
      const b = dev.createBuffer({ size: Math.max(16, data.byteLength), usage: usage | GPUBufferUsage.COPY_DST });
      dev.queue.writeBuffer(b, 0, data);
      return b;
    };
    const aBuf = buf(A, GPUBufferUsage.STORAGE);
    const qBuf = buf(new Uint32Array(q.buffer, 0, q.byteLength / 4), GPUBufferUsage.STORAGE);
    const sBuf = buf(s, GPUBufferUsage.STORAGE);
    const cBuf = dev.createBuffer({ size: M * N * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
    const dims = new Uint32Array([M, N, K, pad]);
    const dBuf = buf(dims, GPUBufferUsage.UNIFORM);

    const bind = dev.createBindGroupLayout({ entries: [
      { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'read-only-storage' } },
      { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'read-only-storage' } },
      { binding: 2, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'read-only-storage' } },
      { binding: 3, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
      { binding: 4, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'uniform' } },
    ]});
    const pipe = dev.createComputePipeline({ layout: dev.createPipelineLayout({ bindGroupLayouts: [bind] }), compute: { module, entryPoint: 'main' } });
    const group = dev.createBindGroup({ layout: bind, entries: [
      { binding: 0, resource: { buffer: aBuf } }, { binding: 1, resource: { buffer: qBuf } },
      { binding: 2, resource: { buffer: sBuf } }, { binding: 3, resource: { buffer: cBuf } },
      { binding: 4, resource: { buffer: dBuf } },
    ]});

    const enc = dev.createCommandEncoder();
    const pass = enc.beginComputePass();
    pass.setPipeline(pipe); pass.setBindGroup(0, group);
    pass.dispatchWorkgroups(Math.ceil(M / 128), Math.ceil(N / 64));
    pass.end();
    const readback = dev.createBuffer({ size: M * N * 4, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    enc.copyBufferToBuffer(cBuf, 0, readback, 0, M * N * 4);
    const t0 = performance.now();
    dev.queue.submit([enc.finish()]);
    await readback.mapAsync(GPUMapMode.READ);
    const ms = performance.now() - t0;
    const C = new Float32Array(readback.getMappedRange().slice(0));
    readback.unmap();

    let err = 0, ref = null, bad = [];
    if (check) {
      ref = cpuRef(A, unpack(q, s, N, K), M, N, K);
      for (let i = 0; i < C.length; i++) {
        const e = Math.abs(C[i] - ref[i]);
        if (e > 1e-3 && bad.length < 6) bad.push([i, C[i].toFixed(4), ref[i].toFixed(4)]);
        err = Math.max(err, e);
      }
      if (bad.length) log('mismatch (idx, gpu, cpu): ' + JSON.stringify(bad));
    }
    const flops = 2 * M * N * K;
    return { ms, err, flops, ref, C };
  }

  // 正确性：小尺寸 + CPU 参考
  const dbg = await run(64, 64, 128, false, 1);
  log('As[0..7]  ' + Array.from(dbg.C.slice(0, 8), v => v.toFixed(3)).join(' '));
  log('Bs[0..7]  ' + Array.from(dbg.C.slice(32, 40), v => v.toFixed(4)).join(' '));
  const small = await run(64, 64, 128, true);
  const scaleRef = Math.max(...Array.from(small.ref, Math.abs));
  row('check 64×64×128', `max|gpu-cpu| = ${small.err.toExponential(2)} (参考量级 ${scaleRef.toFixed(1)})`,
      small.err < scaleRef * 2e-3 ? 'ok' : 'bad');

  // 性能：接近一个 block 的 qkv 形状
  for (const [M, N, K] of [[2048, 3072, 1024], [8192, 3072, 1024]]) {
    const r = await run(M, N, K, false);
    const gflops = r.flops / (r.ms * 1e6);
    row(`gemm ${M}×${N}×${K}`, `${r.ms.toFixed(1)} ms · ${gflops.toFixed(0)} GFLOP/s`);
  }
  row('note', '一次 2 步采样要走 26 个 block × 4 个 GEMM，这里量的是其中一个');
}

main().catch(e => { row('error', e.message, 'bad'); log(String(e.stack || e)); });
</script>
</body>
</html>
