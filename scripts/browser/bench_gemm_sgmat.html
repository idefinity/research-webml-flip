<!doctype html>
<html>
<head><meta charset="utf-8"><title>webgpu gemm bench · subgroup matrix</title></head>
<body style="font:13px ui-monospace,monospace">
<pre id="out">running</pre>
<script type="module">
// Same N=2048 GEMM as bench_gemm_f16.html, but through the hardware matrix
// pipeline (chromium_experimental_subgroup_matrix) instead of scalar FMA.
//
// The kernel is WebFM's, verbatim in structure: 128x64 block tile, 256 threads
// = 8 subgroups, each subgroup owns a 32x32 output patch as 16 8x8 fragments,
// fp16 operands with fp32 accumulators. That's the whole difference between
// 2.2 TFLOPS (plain f16 FMA) and whatever tensor cores give here.
//
// Needs Chrome started with --enable-unsafe-webgpu.

const N = parseInt(new URLSearchParams(location.search).get("n") || "2048", 10);
const WARMUP = 2;
const PASSES = 7;

const SRC = `
enable f16;
enable chromium_experimental_subgroup_matrix;
diagnostic(off, chromium.subgroup_matrix_uniformity);

struct P { M: u32, N: u32, K: u32, pad: u32 };
@group(0) @binding(0) var<uniform> p: P;
@group(0) @binding(1) var<storage, read> A: array<f16>;
@group(0) @binding(2) var<storage, read> B: array<f16>;
@group(0) @binding(3) var<storage, read> bias: array<f16>;
@group(0) @binding(4) var<storage, read_write> C: array<f16>;

const TR: u32 = 128u; const TC: u32 = 64u; const TK: u32 = 32u;
var<workgroup> tile_A: array<f16, TR * TK>;
var<workgroup> tile_B: array<f16, TC * TK>;
var<workgroup> scratch: array<array<f32, 64>, 8>;

@compute @workgroup_size(256)
fn main(@builtin(workgroup_id) wg: vec3<u32>, @builtin(local_invocation_index) tid: u32) {
  let bm = wg.x * TR; let bn = wg.y * TC;
  let sg = tid / 32u; let lane = tid % 32u;
  let sg_row = sg / 2u; let sg_col = sg % 2u;
  var acc: array<subgroup_matrix_result<f32, 8, 8>, 16>;
  for (var i = 0u; i < 16u; i++) { acc[i] = subgroup_matrix_result<f32, 8, 8>(); }
  let nk = min((p.K + TK - 1u) / TK, 2048u);
  for (var kt = 0u; kt < nk; kt++) {
    let k0 = kt * TK;
    for (var i = 0u; i < 16u; i++) {
      let idx = i * 256u + tid; let r = idx / TK; let c = idx % TK;
      let gr = bm + r; let gc = k0 + c;
      var v: f16 = f16(0.0);
      if (gr < p.M && gc < p.K) { v = A[gr * p.K + gc]; }
      tile_A[idx] = v;
    }
    for (var i = 0u; i < 8u; i++) {
      let idx = i * 256u + tid; let gn = idx % TC; let gk = idx / TC;
      let gr = bn + gn; let gc = k0 + gk;
      var v: f16 = f16(0.0);
      if (gr < p.N && gc < p.K) { v = B[gc * p.N + gr]; }
      tile_B[gn * TK + gk] = v;
    }
    workgroupBarrier();
    for (var step = 0u; step < TK; step += 8u) {
      let a_off = (sg_row * 32u) * TK + step;
      let m0 = subgroupMatrixLoad<subgroup_matrix_left<f16, 8, 8>>(&tile_A, a_off, false, TK);
      let m1 = subgroupMatrixLoad<subgroup_matrix_left<f16, 8, 8>>(&tile_A, a_off + 8u * TK, false, TK);
      let m2 = subgroupMatrixLoad<subgroup_matrix_left<f16, 8, 8>>(&tile_A, a_off + 16u * TK, false, TK);
      let m3 = subgroupMatrixLoad<subgroup_matrix_left<f16, 8, 8>>(&tile_A, a_off + 24u * TK, false, TK);
      let b_off = (sg_col * 32u) * TK + step;
      let n0 = subgroupMatrixLoad<subgroup_matrix_right<f16, 8, 8>>(&tile_B, b_off, true, TK);
      let n1 = subgroupMatrixLoad<subgroup_matrix_right<f16, 8, 8>>(&tile_B, b_off + 8u * TK, true, TK);
      let n2 = subgroupMatrixLoad<subgroup_matrix_right<f16, 8, 8>>(&tile_B, b_off + 16u * TK, true, TK);
      let n3 = subgroupMatrixLoad<subgroup_matrix_right<f16, 8, 8>>(&tile_B, b_off + 24u * TK, true, TK);
      acc[0] = subgroupMatrixMultiplyAccumulate(m0, n0, acc[0]);
      acc[1] = subgroupMatrixMultiplyAccumulate(m0, n1, acc[1]);
      acc[2] = subgroupMatrixMultiplyAccumulate(m0, n2, acc[2]);
      acc[3] = subgroupMatrixMultiplyAccumulate(m0, n3, acc[3]);
      acc[4] = subgroupMatrixMultiplyAccumulate(m1, n0, acc[4]);
      acc[5] = subgroupMatrixMultiplyAccumulate(m1, n1, acc[5]);
      acc[6] = subgroupMatrixMultiplyAccumulate(m1, n2, acc[6]);
      acc[7] = subgroupMatrixMultiplyAccumulate(m1, n3, acc[7]);
      acc[8] = subgroupMatrixMultiplyAccumulate(m2, n0, acc[8]);
      acc[9] = subgroupMatrixMultiplyAccumulate(m2, n1, acc[9]);
      acc[10] = subgroupMatrixMultiplyAccumulate(m2, n2, acc[10]);
      acc[11] = subgroupMatrixMultiplyAccumulate(m2, n3, acc[11]);
      acc[12] = subgroupMatrixMultiplyAccumulate(m3, n0, acc[12]);
      acc[13] = subgroupMatrixMultiplyAccumulate(m3, n1, acc[13]);
      acc[14] = subgroupMatrixMultiplyAccumulate(m3, n2, acc[14]);
      acc[15] = subgroupMatrixMultiplyAccumulate(m3, n3, acc[15]);
    }
    workgroupBarrier();
  }
  let row0 = bm + sg_row * 32u;
  let col0 = bn + sg_col * 32u;
  for (var f = 0u; f < 16u; f++) {
    subgroupMatrixStore(&scratch[sg], 0u, acc[f], false, 8u);
    workgroupBarrier();
    let fr = f / 4u; let fc = f % 4u;
    for (var e = lane; e < 64u; e += 32u) {
      let i = e / 8u; let j = e % 8u;
      let gr = row0 + fr * 8u + i; let gc = col0 + fc * 8u + j;
      if (gr < p.M && gc < p.N) { C[gr * p.N + gc] = f16(clamp(scratch[sg][e] + f32(bias[gc]), -60000.0, 60000.0)); }
    }
    workgroupBarrier();
  }
}
`;

async function run(device) {
  const nbytes = N * N * 2;
  const mk = (bits) => {
    const b = device.createBuffer({ size: nbytes, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(b, 0, new Uint16Array(N * N).fill(bits));
    return b;
  };
  // 0x3c00 = 1.0 in fp16
  const A = mk(0x3c00), B = mk(0x3c00), C = mk(0), bias = mk(0);
  const cfg = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(cfg, 0, new Uint32Array([N, N, N, 0]));

  const module = device.createShaderModule({ code: SRC });
  const info = await module.getCompilationInfo();
  const errs = info.messages.filter(m => m.type === "error");
  if (errs.length) throw new Error(errs.map(e => e.message).join("; "));

  const pipeline = device.createComputePipeline({ layout: "auto", compute: { module, entryPoint: "main" } });
  const bg = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: cfg } },
      { binding: 1, resource: { buffer: A } },
      { binding: 2, resource: { buffer: B } },
      { binding: 3, resource: { buffer: bias } },
      { binding: 4, resource: { buffer: C } },
    ],
  });

  const once = async () => {
    const enc = device.createCommandEncoder();
    const p = enc.beginComputePass();
    p.setPipeline(pipeline);
    p.setBindGroup(0, bg);
    p.dispatchWorkgroups(Math.ceil(N / 128), Math.ceil(N / 64), 1);
    p.end();
    device.queue.submit([enc.finish()]);
    const t0 = performance.now();
    await device.queue.onSubmittedWorkDone();
    return performance.now() - t0;
  };

  for (let i = 0; i < WARMUP; i++) await once();
  const times = [];
  for (let i = 0; i < PASSES; i++) times.push(await once());
  times.sort((a, b) => a - b);
  const median = times[Math.floor(times.length / 2)];
  const gflops = (2 * N * N * N) / (median / 1000) / 1e9;
  [A, B, C, cfg, bias].forEach(x => x.destroy());
  return { median_ms: +median.toFixed(2), min_ms: +times[0].toFixed(2), gflops: +gflops.toFixed(1) };
}

(async () => {
  const out = document.getElementById("out");
  const lines = [];
  const log = (s) => { lines.push(s); out.textContent = lines.join("\n"); };
  try {
    const adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" });
    if (!adapter) throw new Error("no adapter");
    const feats = [...adapter.features];
    const hasSg = feats.includes("chromium-experimental-subgroup-matrix");
    log("vendor=" + adapter.info.vendor + " arch=" + adapter.info.architecture);
    log("subgroup-matrix=" + hasSg + "  shader-f16=" + feats.includes("shader-f16"));
    if (!hasSg) throw new Error("chromium-experimental-subgroup-matrix not exposed (start Chrome with --enable-unsafe-webgpu)");
    const device = await adapter.requestDevice({
      requiredFeatures: ["shader-f16", "chromium-experimental-subgroup-matrix"],
    });
    log("N=" + N + "  128x64 tile, 256 threads, 16 fp32 8x8 fragments/subgroup");
    const r = await run(device);
    log(`sgmat  ${r.median_ms} ms  ${r.gflops} GFLOPS  (best ${r.min_ms} ms)`);
    log("---");
    log(`RESULT ${JSON.stringify({ ...r, subgroup_matrix: true })}`);
  } catch (e) {
    log("FAIL " + e.message);
    log("---");
    log(`RESULT ${JSON.stringify({ error: e.message })}`);
  }
  document.title = "READY";
})();
</script>
</body>
</html>
