<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flip splat shot</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #cfcfcf; }
  canvas { display: block; }
  #msg { position: fixed; left: 8px; top: 8px; font: 12px/1.4 system-ui, sans-serif; color: #333; }
</style>
</head>
<body>
<div id="msg">loading</div>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "@sparkjsdev/spark": "./vendor/spark.module.js"
  }
}
</script>
<script>
window.__err = [];
window.addEventListener("error", e => {
  window.__err.push(String(e.message));
  document.getElementById("msg").textContent = "ERR " + window.__err.join(" | ");
  document.title = "ERR";
});
window.addEventListener("unhandledrejection", e => {
  window.__err.push("rej:" + String(e.reason));
  document.getElementById("msg").textContent = "ERR " + window.__err.join(" | ");
  document.title = "ERR";
});
</script>
<script type="module">
import * as THREE from "three";
import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

const P = new URLSearchParams(location.search);
const url = P.get("ply");
const az = parseFloat(P.get("az") || "0") * Math.PI / 180;
const el = parseFloat(P.get("el") || "0") * Math.PI / 180;
const fov = parseFloat(P.get("fov") || "40");
const pad = parseFloat(P.get("pad") || "1.45");
const C = P.get("c") ? P.get("c").split(",").map(Number) : null;
const RAD = parseFloat(P.get("r") || "0");
const FLIP = parseFloat(P.get("flip") || "1");
const msg = document.getElementById("msg");

const W = window.innerWidth, H = window.innerHeight;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfcfcf);

const camera = new THREE.PerspectiveCamera(fov, W / H, 0.001, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);

const spark = new SparkRenderer({ renderer });
scene.add(spark);

let loaded = false;
const splat = new SplatMesh({ url, onLoad: () => { loaded = true; } });
const root = new THREE.Group();
root.add(splat);
splat.rotation.y = Math.PI / 2;
root.rotation.x = FLIP * Math.PI;
scene.add(root);

function frame() {
  let c, maxDim;
  if (C && RAD > 0) {
    // the group above rotates the splat, so the PLY-space centre has to go
    // through the same transform or the camera aims at empty space
    root.updateMatrixWorld(true);
    c = new THREE.Vector3(C[0], C[1], C[2]).applyMatrix4(splat.matrixWorld);
    maxDim = RAD * 2;
  } else {
    const box = new THREE.Box3().setFromObject(root);
    if (box.isEmpty() || !isFinite(box.min.x)) return false;
    const s = new THREE.Vector3();
    c = new THREE.Vector3();
    box.getCenter(c);
    box.getSize(s);
    maxDim = Math.max(s.x, s.y, s.z) || 1;
  }
  const dist = maxDim * pad * 1.15;
  camera.position.set(
    c.x + Math.sin(az) * Math.cos(el) * dist,
    c.y + Math.sin(el) * dist,
    c.z + Math.cos(az) * Math.cos(el) * dist
  );
  camera.lookAt(c);
  camera.updateProjectionMatrix();
  return true;
}

let total = 0, done = 0, framed = false;
function finish(tag) {
  msg.textContent = "ready " + tag + (loaded ? " loaded" : " empty");
  document.title = "READY";
}
function loop() {
  total++;
  renderer.render(scene, camera);
  if (!framed && loaded) framed = frame();
  if (framed) {
    renderer.render(scene, camera);
    done++;
    if (done > 20) return finish("framed");
  }
  if (total > 900) return finish("timeout");
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
